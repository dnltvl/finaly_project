<div class="box_logo"></div>
<div class="box2"><p class="important">System Settings</p></div>
<br>
<form [formGroup]="settingsForm" (ngSubmit)="save()">

  <div class="box5">
    <label for="vatRate">VAT Rate (e.g. 0.18 = 18%): </label>
    <input id="vatRate" type="number" step="0.01" formControlName="vatRate">
    <p class="important" *ngIf="settingsForm.get('vatRate')?.invalid && settingsForm.get('vatRate')?.touched">
      Must be a number between 0 and 1
    </p>
  </div>

  <div class="box5">
    <label for="discountThreshold">Discount Threshold (min purchases): </label>
    <input id="discountThreshold" type="number" formControlName="discountThreshold">
    <p class="important" *ngIf="settingsForm.get('discountThreshold')?.invalid && settingsForm.get('discountThreshold')?.touched">
      Must be a positive number
    </p>
  </div>

  <div class="box5">
    <label for="discountRate">Discount Rate (e.g. 0.1 = 10%): </label>
    <input id="discountRate" type="number" step="0.01" formControlName="discountRate">
    <p class="important" *ngIf="settingsForm.get('discountRate')?.invalid && settingsForm.get('discountRate')?.touched">
      Must be a number between 0 and 1
    </p>
  </div>

  <div class="box5" align="center">
    <button class="button2" type="submit">Save Settings</button>
    <p *ngIf="saveSuccess" style="color: green;">Settings saved successfully!</p>
  </div>

</form>
